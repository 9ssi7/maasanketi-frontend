basePath: /api/v1
definitions:
  handler.SurveyResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      title:
        type: string
    type: object
host: localhost:4004
info:
  contact:
    email: support@maasanketi.co
    name: API Support
    url: http://www.maasanketi.co/support
  description: API for the Software Engineer Salary Survey platform
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Software Engineer Salary Survey API
  version: "1.0"
paths:
  /api/v1/surveys:
    get:
      consumes:
      - application/json
      description: Get all available surveys
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.SurveyResponse'
            type: array
      summary: Get all surveys
      tags:
      - surveys
  /api/v1/surveys/{id}:
    get:
      consumes:
      - application/json
      description: Get a survey by its ID
      parameters:
      - description: Survey ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.SurveyResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a survey by ID
      tags:
      - surveys
  /healthcheck:
    get:
      consumes:
      - '*/*'
      description: get the status of server.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Show the status of server.
      tags:
      - HealthCheck
schemes:
- http
- https
swagger: "2.0"
